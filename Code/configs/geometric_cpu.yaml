seed: 0
methods: [none, fusion, triangulation, ransac, robust_triangulation, robust_depth, residual_threshold, witness_only, local, local_all, global, global_uniform]
robust_loss: huber
solver:
  time_limit: 2.0
  proposal_tolerance: 1.0e-8
  recovery_rows: 12
repair:
  q: 0
  z_min: 0.01
  max_hypotheses: 64
  extraction: dual
  extraction_queries: 128
  save_evidence: true
global:
  block_tracks: 32
  delta: 1.0
  ridge: 0.001
  spatial: 0.01
  max_iterations: 20

