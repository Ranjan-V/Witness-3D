[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witness3d"
version = "0.1.0"
description = "Research reference for conditional geometric verification and selective depth repair"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
vision = ["torch>=2.1", "torchvision>=0.16", "opencv-python-headless>=4.8", "timm>=0.9"]
plots = ["matplotlib>=3.7"]
test = ["pytest>=7.4"]

[project.scripts]
witness3d = "witness3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

